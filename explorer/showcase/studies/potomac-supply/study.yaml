# An AquaScope study (version 3): the plan behind an answer, its gates, and what happened.
#   aquascope run study.yaml
version: 3
title: "Determine whether a fixed municipal abstraction of 8 m3/s at: 38.95, -77.13"
question: "Can the Potomac at Little Falls reliably supply 8 m3/s to the city's water works, run of river, in a dry year?"
created: "2026-09-14T21:20:25+00:00"
aquascope_version: "0.16.0"
author: "methodologist"
model: "claude-sonnet-5"
problem:
  kind: "supply_reliability"
  site: {"lat": 38.95, "lon": -77.13}
  params: {"demand_m3s": 8.0, "use": "municipal", "share": 0.1, "storage": false, "demand_ml_day": null}
  text: "Can the Potomac at Little Falls reliably supply 8 m3/s to the city's water works, run of river, in a dry year?"
plan:
  author: "methodologist"
  playbook: "supply_reliability"
  objective: "Determine whether a fixed municipal abstraction of 8 m3/s at Little Falls on the Potomac can be reliably supplied run-of-river, without storage, through a dry year."
  decision: "whether an 8 m3/s abstraction at Little Falls can be reliably supplied to the water works, run of river, during a dry year"
  methodology: ["Characterise the catchment upstream of the Little Falls point to see how large and how regulated the basin is.", "Analyze the long daily discharge record at the nearest gauge to get its flow-duration curve and check for a trend.", "Compute the low-flow signatures at the same gauge (Q95, Q50, Q10, baseflow index, 7Q10) to describe dry-spell behaviour.", "Run the run-of-river supply-reliability screening at 8 m3/s demand, keeping Q95 in the river and capping the take at 10 percent of daily flow, to get the days, years and volume on which the demand is met."]
  assumptions: ["USGS-01646502 (Potomac River, adjusted, near Washington, DC) at 0.2 km is the primary gauge used, given its long 95.7-year daily discharge record", "daily resolution is assumed for the discharge record as the catalog does not state it explicitly", "the default screening share of 10% of daily flow is used since the text gives no other threshold", "run of river as stated in the problem means no storage is available to buffer low flows", "USGS-01646502 (Potomac River, adjusted, near Washington, DC), 0.2 km from the point and with 95.7 years of daily discharge, is the primary and sufficient record for this decision.", "Daily resolution is assumed for the discharge record since the catalog does not state it explicitly.", "The default screening share of 10 percent of daily flow and a Q95 in-river reserve are used, as the brief gives no other threshold.", "Run of river as stated means no storage is available to buffer low flows, so reliability is read directly off the daily record."]
  alternatives: [{"method": "similar_basins", "why_not": "marked marginal in the sufficiency table: it is meant for an ungauged point, and a 95.7-year gauge sits 0.2 km from Little Falls"}, {"method": "regionalize_signatures", "why_not": "not needed; the at-site record is long and dense enough to compute the signatures directly"}, {"method": "gr4j_calibration", "why_not": "not_defensible per sufficiency: the 30,091 km2 catchment exceeds the 10,000 km2 ceiling for a lumped rainfall-runoff model"}]
  limitations_expected: ["This is a screening rule, not a licence assessment: keeping Q95 in the river and capping the take at 10 percent of flow follows flow-duration-curve environmental-flow practice, not a regulator's flow standard.", "Upstream abstractions, return flows and any storage operations above the gauge are not represented in the reliability number.", "Reliability describes the years on record; a changing climate, new upstream abstraction, or a drier decade than any recorded would move it."]
  citations: ["Vogel, R. M. and Fennessey, N. M. (1994). Flow-duration curves I: new interpretation and confidence intervals. J. Water Resour. Plann. Manage. 120, 485-504.", "Smakhtin, V., & Eriyagama, N. (2008). Developing a software package for global desktop assessment of environmental flows. Environ. Model. Softw. 23, 1396-1406. doi:10.1016/j.envsoft.2008.04.002", "Acreman, M., & Dunbar, M. J. (2004). Defining environmental river flow requirements: a review. Hydrol. Earth Syst. Sci. 8, 861-876.", "Smakhtin, V. U. (2001). Low flow hydrology: a review. J. Hydrol. 240, 147-186.", "Lyne, V., & Hollick, M. (1979). Stochastic time-variable rainfall-runoff modelling. Inst. Eng. Aust. Natl. Conf. Publ. 79/10, 89-93.", "Oudin, L. et al. (2008). Spatial proximity, physical similarity, regression and ungaged catchments. Water Resour. Res. 44, W03413.", "National-scale validation of donor regionalisation: Hydrol. Earth Syst. Sci. 28 (2024), doi:10.5194/hess-28-3367-2024", "Smakhtin and Eriyagama 2008", "Acreman and Dunbar 2004"]
  caveats: ["A screening rule, not a licence assessment: Q95 kept in the river and at most the stated share of the flow taken are assumptions in the tradition of flow-duration-curve environmental-flow practice (Smakhtin and Eriyagama 2008; Acreman and Dunbar 2004); the regulator's flow standard, return flows, upstream abstractions and storage are not in the number.", "Reliability read off the record describes the years on record; a changing climate, new upstream abstraction or a drier decade than any recorded moves it."]
  rationale: "Determine whether a fixed municipal abstraction of 8 m3/s at Little Falls on the Potomac can be reliably supplied run-of-river, without storage, through a dry year."
  recon_notes: ["Record resolution is not in the catalog; daily is assumed for every variable.", "10 donor gauges from a pool of 34,786 gauged catchments.", "ERA5 temperature and forcing and GloFAS discharge are assumed reachable for any point on land (Open-Meteo); not checked here.", "CMIP6 change factors need model output you supply (aquascope.climate works on downloaded data); not counted."]
steps:
  - tool: "describe_catchment"
    id: "s1"
    rationale: "Catchment size, upstream area and the small number of dams frame whether the low flows at the point are natural and unregulated."
    arguments:
      lat: 38.95
      lon: -77.13
    outputs: [{"kind": "figure", "id": "s1_site_map", "caption": "site map from describe_catchment"}, {"kind": "table", "id": "s1_catchment_attributes", "caption": "catchment attributes from describe_catchment"}]
  - tool: "analyze_station"
    id: "s2"
    rationale: "The 95.7-year daily record at the gauge closest to the point gives the flow-duration curve and a trend check on the series."
    method: "flow_duration"
    arguments:
      source: "usgs"
      station_id: "USGS-01646502"
    expects:
      - {"check": "min_years", "value": 10, "path": "years"}
      - {"check": "not_empty", "path": "trend", "repaired_from": "fdc"}
      - {"check": "unit_present", "path": "unit"}
    outputs: [{"kind": "figure", "id": "s2_fdc", "caption": "fdc from analyze_station"}, {"kind": "figure", "id": "s2_trend", "caption": "trend from analyze_station"}, {"kind": "table", "id": "s2_fdc_percentiles", "caption": "fdc percentiles from analyze_station"}, {"kind": "table", "id": "s2_summary", "caption": "summary from analyze_station"}]
  - tool: "low_flow_context"
    id: "s3"
    rationale: "Q95, Q50, Q10, the baseflow index and the 7Q10 low-flow frequency describe how the river behaves in a dry year."
    method: "low_flow_frequency"
    arguments:
      source: "usgs"
      station_id: "USGS-01646502"
    expects:
      - {"check": "min_years", "value": 10, "path": "years"}
    outputs: [{"kind": "table", "id": "s3_low_flow", "caption": "low flow statistics from low_flow_context"}]
  - tool: "supply_reliability"
    id: "s4"
    rationale: "The screening rule on the same daily record gives the fraction of days, years and volume on which the fixed 8 m3/s demand can be met while Q95 stays in the river and no more than 10 percent of daily flow is taken."
    method: "supply_reliability"
    arguments:
      source: "usgs"
      station_id: "USGS-01646502"
      demand_m3s: 8.0
      demand_ml_day: null
      share: 0.1
      reserve: "q95"
    expects:
      - {"check": "min_years", "value": 10, "path": "years"}
      - {"check": "not_empty", "path": "reliability"}
      - {"check": "not_empty", "path": "fdc"}
    depends_on: ["s2", "s3"]
    outputs: [{"kind": "figure", "id": "s4_reliability_curve", "caption": "reliability curve from supply_reliability"}, {"kind": "table", "id": "s4_reliability", "caption": "reliability from supply_reliability"}, {"kind": "table", "id": "s4_fdc_percentiles", "caption": "fdc percentiles from supply_reliability"}]
