  s3: {"ok": true, "gates": [{"check": "min_years", "passed": true, "detail": "95.7 years of record, 10 needed"}], "summary": "source=usgs, station_id=USGS-01646502, variable=discharge, unit=m3/s, years=95.7, start=1930-03-01, end=2025-10-31", "fallback_used": false, "sha256": "138b5a644040fb6a"}
