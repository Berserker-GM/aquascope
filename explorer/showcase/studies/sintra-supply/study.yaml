  - tool: "similar_basins"
    id: "s2"
    rationale: "Selects donor gauges whose catchments most resemble this one in BasinATLAS attribute space, the basis for the regionalised transfer."
    method: "similar_basins"
    arguments:
      lat: 38.8
      lon: -9.38
